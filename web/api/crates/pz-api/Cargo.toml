[package]
name = "pz-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
pz-bridge.workspace = true
pz-rcon.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json", "uuid"] }
thiserror = "2.0.20"
time = "0.3.55"
# Two-factor. `otpauth` for the enrolment URI and `gen_secret` for the secret
# itself; deliberately not `qr`, which pulls in an image encoder — the QR code
# is drawn in the browser from the URI.
totp-rs = { version = "5.7.2", default-features = false, features = ["otpauth", "gen_secret"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-gzip", "timeout", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
