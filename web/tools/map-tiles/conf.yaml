# Paths inside the container. The game install is mounted read-only; the render
# writes only to /out.
pz_root: /pz
output_root: /out
mod_root: /pz/steamapps/workshop/content/108600
custom_root: .
save_game_root: /dev/null

output_entry: default
output_route: map_data/

# B42, matching the server build.
map_conf_default: default_b42.txt
map_conf:
    - vanilla.txt
    - mod/

# Vanilla Knox County. Matches Map=Muldraugh, KY in server.ini.
base_map: default
mod_maps: []
save_games: []

render_conf:
    verbose: true
    worker_count: auto

    # 2048, NOT the shipped default of 1024. ISO_DZI.tileSize in
    # web/ui/src/lib/iso-tiles.ts is 2048 and the client's tileSpan() maths is
    # built on it. verify.py enforces this.
    tile_size: 2048

    # Only building layer 0. The client requests layer0_files exclusively, and
    # rendering the upper floors would multiply the work for tiles nothing asks
    # for. Range is half-open: [0, 1] is layer 0 alone.
    layer_range: [0, 1]

    # Discard the two deepest levels on a FULL county run: 22 and 21. Leaves
    # 0-20, about 22k tiles and 24 GB instead of ~80 GB (z21) or ~200 GB (z22).
    # Street-level (DEFAULT_ISO_SCALE) is still native z20. Regional jobs patch
    # this to 1 so they can write z21 for just those cells — see run.sh.
    omit_levels: 2

    # Bound the shared-memory tile cache. THIS IS NOT OPTIONAL.
    #
    # The cache holds rendered children in /dev/shm so a parent tile can be
    # merged from them. pzmap2dzi defaults cache_limit_mb to 0, and
    # scheduling.py gates eviction on `if self.cache_size:` -- 0 is falsy, so
    # with the default the eviction loop NEVER RUNS and the cache grows without
    # limit until shared memory is gone.
    #
    # What that looks like is not an error. Workers die on the allocation
    # without raising, the parent waits on them forever, and the render sits at
    # 0% CPU having written nothing. Twice observed: once against Docker's 64 MB
    # /dev/shm default, then again at 3744 MB against a 4 GB ceiling. Raising
    # shm_size alone only moves the wall.
    #
    # Held well under the service's shm_size (8g in docker-compose.web.yml) so
    # the 16 workers' in-flight 16 MB buffers still have room above the cache.
    # Must be large enough that NOTHING is ever evicted. This is not a
    # performance knob, it is a correctness one.
    #
    # omit_levels above means levels 21 and 22 are rendered but never written
    # to disk -- they exist only in this cache, and level 20 is merged from
    # them. Upstream's own default is enable_cache: false (see their conf.yaml)
    # and they added commit cfb29a55 so omit_levels works with the cache off.
    # We keep the cache for speed. patch_scheduler.py (applied at image build)
    # refuses to LRU-evict a tile whose parent is still pending, which is the
    # combination that painted black rectangles: save_tile returns 'skip' for
    # omitted levels, so an evicted child is destroyed and its parent merges a
    # missing quadrant as black.
    #
    # Measured without the pin: at 4096 MB the render reported `cache hit:
    # 336376/349463 = 96.26%` and produced ~13,000 black holes. At 16384, peak
    # 5760, nothing was evicted and those holes were gone — but the next run
    # that hits the ceiling would paint them again. The pin is the actual fix;
    # the high limit is still the cheaper working set.
    #
    # run.sh still fails the run if the peak comes within 5% of the limit.
    cache_limit_mb: 16384

    # jpg for the base layer is already the default; stated so a future default
    # change cannot silently break the client's .jpg URLs.
    image_fmt_base_layer0: jpg
    image_save_options:
        # 85 was the original pack: 24 GB, most of it z20. 70 is the usual
        # map-tile quality and is what new regional / detail tiles (including
        # z21) are saved at. Recompress the existing pack with
        # `make map-tiles-recompress` if you want the same savings in-place.
        jpg: {quality: 70, optimize: true}

# Leave tile_align_levels and dzi_cell_range at their defaults on the first
# run. They set the image bounds, and the defaults are what pzmap.org used.
# The Task 1 geometry gate (verify.py) is what tests that assumption.
#
# Verified output layout (differs from the obvious guess — no `default` segment,
# despite output_entry/output_route above reading as though there would be one):
#   /out/html/map_data/base/layer0.dzi
#   /out/html/map_data/base/map_info.json      <- geometry, checked by verify.py
#   /out/html/map_data/base/layer0_files/{z}/{x}_{y}.jpg
