# Security headers, kept in one file because nginx makes them easy to lose.
#
# `add_header` is inherited from the enclosing block ONLY when the current
# block declares no `add_header` of its own. Every location that sets so much
# as a Cache-Control therefore silently drops the whole server-level set — and
# the SPA fallback rewrites `/` to `/index.html`, so the document itself lands
# in exactly such a location. That is how this app came to serve no CSP at all
# on any HTML or asset response while still passing a header check on /api.
#
# So: include this from the server block AND from every location that adds a
# header of its own. Do not inline these anywhere; one copy is the point.
#
# img-src needs no external host: map tiles are served from /api/v1/map-tiles
# out of the locally rendered pack. See docs/map-tiles.md.
#
# style-src needs 'unsafe-inline': Tailwind's utilities and the hero's inline
# grid background are both style attributes.
#
# font-src needs data:: Vite inlines the smaller woff2 subsets as data URIs, so
# a bare 'self' blocks the site's own fonts. This went unnoticed for as long as
# it did because the header was never actually reaching the document.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
