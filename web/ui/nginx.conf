server {
    # 8080 rather than 80: the image runs unprivileged and cannot bind low ports.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API. The browser never makes a cross-origin call in
    # production, which is why CORS problems cannot appear only after deploy.
    location /api/ {
        proxy_pass http://web-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Comfortably above the API's own 15s request ceiling.
        # Backup download/import can take longer and is large.
        client_max_body_size 2g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Vite fingerprints every asset filename, so these can never go stale.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: the router owns every path that is not a real file.
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    # The SPA fallback in `location /` rewrites every unknown path to here, so
    # this block serves the document and must carry the security headers too.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Covers every location that does not add headers of its own; the ones that
    # do include this file themselves. See the file for why.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
