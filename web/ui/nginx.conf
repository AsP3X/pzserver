server {
    # 8080 rather than 80: the image runs unprivileged and cannot bind low ports.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API. The browser never makes a cross-origin call in
    # production, which is why CORS problems cannot appear only after deploy.
    location /api/ {
        proxy_pass http://web-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Comfortably above the API's own 15s request ceiling.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Vite fingerprints every asset filename, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: the router owns every path that is not a real file.
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # style-src needs 'unsafe-inline': Tailwind's utilities and the hero's
    # inline grid background are both style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
