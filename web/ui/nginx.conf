# This file is included from http {}, so zone directives belong here.
# 8/min with a small burst: enough for a real person, not a wordlist.
limit_req_zone $binary_remote_addr zone=auth:10m rate=8r/m;

server {
    # 8080 rather than 80: the image runs unprivileged and cannot bind low ports.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not put the listen port (8080) into Location headers. A request for
    # `/api` used to 301 to `http://host:8080/api/` because `location /api/`
    # is a prefix that auto-redirects the slash-less URL using this port.
    absolute_redirect off;
    port_in_redirect off;

    # The edge (NPM / Caddy) is a private hop. Take the client address from
    # X-Forwarded-For so auth rate limits are per visitor, not per proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # NPM terminates TLS and forwards HTTP. If the public side was http,
    # send the browser to https. Local hits on :8100 have no forwarded proto
    # and must keep working.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    limit_req_status 429;

    # Same-origin API. The browser never makes a cross-origin call in
    # production, which is why CORS problems cannot appear only after deploy.
    # Internal rewrite so `/api` never 301s onto the container's :8080.
    location = /api {
        rewrite ^ /api/ last;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=16 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_pass http://web-api:8080;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth burst=16 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_pass http://web-api:8080;
    }

    location = /api/v1/auth/2fa/challenge {
        limit_req zone=auth burst=16 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_pass http://web-api:8080;
    }

    location /api/ {
        include /etc/nginx/api-proxy.conf;
        proxy_pass http://web-api:8080;
    }

    # Vite fingerprints every asset filename, so these can never go stale.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Production source maps reconstruct the admin UI. Do not serve them.
    location ~* \.map$ {
        return 404;
    }

    location / {
        # SPA fallback: the router owns every path that is not a real file.
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    # The SPA fallback in `location /` rewrites every unknown path to here, so
    # this block serves the document and must carry the security headers too.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Covers every location that does not add headers of its own; the ones that
    # do include this file themselves. See the file for why.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
