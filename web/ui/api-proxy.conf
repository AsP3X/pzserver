# Shared reverse-proxy settings for /api. Included from every location that
# talks to web-api so auth rate-limit blocks cannot drift from the main one.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Comfortably above the API's own 15s request ceiling.
# Backup download/import can take longer and is large.
client_max_body_size 2g;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_connect_timeout 5s;
proxy_request_buffering off;
proxy_buffering off;
