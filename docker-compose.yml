services:
  # ---------------------------------------------------------------------------
  # PZ Game Server — Dedicated server via SteamCMD
  # Image and arch-specific config provided by docker-compose.{arm64,amd64}.yml
  # ---------------------------------------------------------------------------
  game-server:
    container_name: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
    restart: unless-stopped
    # Allow clean world save on stop (PZ needs time to flush chunks)
    stop_grace_period: 60s
    # Architecture note: the game UID and Laravel www-data both write the shared
    # Lua bridge under ./data/zomboid/Lua. Prefer world-writable files (0666) and
    # non-sticky dirs (0777) via zomboid:heal-lua-bridge. Optionally align UIDs
    # with user: "${PZ_SHARED_UID:-1000}:${PZ_SHARED_GID:-1000}" on app+game when
    # your host image supports a non-root game process (not all do).
    ports:
      - "${PZ_GAME_PORT:-16261}:${PZ_GAME_PORT:-16261}/udp"
      - "${PZ_DIRECT_PORT:-16262}:${PZ_DIRECT_PORT:-16262}/udp"
    volumes:
      # Host-mapped game data (saves, Server/*.ini, logs, Lua bridge, etc.)
      - ${PZ_DATA_HOST:-./data/zomboid}:/home/steam/Zomboid
    networks:
      # Public: Steam / player traffic path (and outbound SteamCMD)
      - proxy-network
      # Private: RCON from app/queue only
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Laravel Application — API + Web Dashboard
  # ---------------------------------------------------------------------------
  app:
    image: ${PZ_APP_IMAGE:-pzserver-app:local}
    build:
      context: ./app
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Localhost-only admin panel (production uses prebuilt Vite assets — no :5173)
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/var/www/html
      # Host-mapped app runtime dirs (seeded from image on first boot if empty)
      - ${PZ_APP_VENDOR_HOST:-./data/app-vendor}:/var/www/html/vendor
      - ${PZ_APP_NODE_MODULES_HOST:-./data/app-node-modules}:/var/www/html/node_modules
      - ${PZ_APP_BUILD_HOST:-./data/app-build}:/var/www/html/public/build
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      - ${PZ_SERVER_HOST:-./data/server}:/pz-server:ro
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      # Same Lua dir the game writes into (subdir of PZ_DATA_HOST)
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      - ${PZ_MAP_TILES_HOST:-./data/map-tiles}:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      # From the root .env, which is also what configure-server.sh writes into
      # server.ini — so the two cannot drift. Without these the app fell back
      # to app/.env's own copy, which had gone stale, and every RCON call
      # failed with "RCON: password doesn't match" in the game console while
      # the panel just showed the server as unreachable.
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      # Both memberships are required. pzserver-internal is declared
      # `internal: true`, and Docker silently drops published ports on a
      # container attached only to an internal network — the `ports:` entry
      # above never binds and `docker port pz-app` returns nothing. Joining the
      # non-internal proxy-network is what makes the publish take effect, so
      # WEB_PROXY_MODE=local can reach the panel on 127.0.0.1:${APP_PORT}.
      # Same reason web-ui joins both in docker-compose.web.yml.
      - proxy-network
      # Private: db, redis, RCON, docker-socket-proxy
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Queue Worker — Processes backup jobs, restart jobs, etc.
  # ---------------------------------------------------------------------------
  queue:
    image: ${PZ_APP_IMAGE:-pzserver-app:local}
    build:
      context: ./app
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-queue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --tries=3 --timeout=600 --sleep=3
    volumes:
      - ./app:/var/www/html
      - ${PZ_APP_VENDOR_HOST:-./data/app-vendor}:/var/www/html/vendor
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      - ${PZ_SERVER_HOST:-./data/server}:/pz-server:ro
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      - ${PZ_MAP_TILES_HOST:-./data/map-tiles}:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      # From the root .env, which is also what configure-server.sh writes into
      # server.ini — so the two cannot drift. Without these the app fell back
      # to app/.env's own copy, which had gone stale, and every RCON call
      # failed with "RCON: password doesn't match" in the game console while
      # the panel just showed the server as unreachable.
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pz-db
    restart: unless-stopped
    # Not published on the host — app/queue reach it via DNS name "db" on pzserver-internal.
    volumes:
      - ${PZ_POSTGRES_HOST:-./data/postgres}:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zomboid}
      POSTGRES_USER: ${DB_USERNAME:-zomboid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zomboid}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zomboid} -d ${DB_DATABASE:-zomboid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Redis — Queue, cache, rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pz-redis
    restart: unless-stopped
    volumes:
      - ${PZ_REDIS_HOST:-./data/redis}:/data
    environment:
      # The literal string "null" counts as no password, not as a password
      # spelled n-u-l-l. Laravel's env() maps "null" to PHP null, so a
      # REDIS_PASSWORD=null (which is what Laravel's own .env.example uses to
      # mean "none") had the app connecting anonymously while this container
      # was enforcing "null" as the actual secret — every request failing with
      # NOAUTH while both files looked like they agreed.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: /bin/sh -c 'set -- --appendonly yes; [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ] && set -- "$$@" --requirepass "$$REDIS_PASSWORD"; exec redis-server "$$@"'
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — Restricted Docker API access for app/queue
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: pz-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Caddy — optional host reverse proxy (enabled with WEB_PROXY_MODE=caddy)
  # Host ports are added by docker-compose.web-caddy.yml
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.2-alpine
    container_name: pz-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - ${PZ_CADDY_DATA_HOST:-./data/caddy-data}:/data
      - ${PZ_CADDY_CONFIG_HOST:-./data/caddy-config}:/config
    depends_on:
      - app
    networks:
      # Public edge (shared reverse-proxy network)
      - proxy-network
      # Reach app on the private network
      - pzserver-internal

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
# proxy-network      — public / shared edge (join existing proxy stack; external)
# pzserver-internal  — private stack network (db, redis, app, queue, RCON)
networks:
  proxy-network:
    name: proxy-network
    external: true
  pzserver-internal:
    name: pzserver-internal
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# All persistent data is bind-mounted under ./data/ (no named Docker volumes).
# -----------------------------------------------------------------------------
#   ./data/zomboid           game saves, Server/*.ini, Lua bridge
#   ./data/server            SteamCMD dedicated server install
#   ./data/backups           panel backups
#   ./data/map-tiles         map tiles (tiles.sqlite pack after generation; see docs/map-tiles.md)
#   ./data/postgres          PostgreSQL data
#   ./data/redis             Redis AOF/data
#   ./data/app-vendor        Composer vendor (seeded from image if empty)
#   ./data/app-node-modules  npm modules (seeded from image if empty)
#   ./data/app-build         Vite public/build (seeded from image if empty)
#   ./data/caddy-data        Caddy certificates / storage
#   ./data/caddy-config      Caddy config state
