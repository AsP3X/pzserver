services:
  # ---------------------------------------------------------------------------
  # PZ Game Server — Dedicated server via SteamCMD
  # Image and arch-specific config provided by docker-compose.{arm64,amd64}.yml
  # ---------------------------------------------------------------------------
  game-server:
    container_name: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
    restart: unless-stopped
    # Allow clean world save on stop (PZ needs time to flush chunks)
    stop_grace_period: 60s
    ports:
      - "${PZ_GAME_PORT:-16261}:${PZ_GAME_PORT:-16261}/udp"
      - "${PZ_DIRECT_PORT:-16262}:${PZ_DIRECT_PORT:-16262}/udp"
    volumes:
      # Host-mapped game data (saves, Server/*.ini, logs, Lua bridge, etc.)
      - ${PZ_DATA_HOST:-./data/zomboid}:/home/steam/Zomboid
    networks:
      # Public: Steam / player traffic path (and outbound SteamCMD)
      - proxy-network
      # Private: RCON from app/queue only
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Laravel Application — API + Web Dashboard
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Localhost-only admin (not on the public Docker network)
      - "127.0.0.1:${APP_PORT:-8000}:8000"
      - "127.0.0.1:5173:5173"
    volumes:
      - ./app:/var/www/html
      - app-vendor:/var/www/html/vendor
      - app-node-modules:/var/www/html/node_modules
      - app-build:/var/www/html/public/build
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      - ${PZ_SERVER_HOST:-./data/server}:/pz-server:ro
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      # Same Lua dir the game writes into (subdir of PZ_DATA_HOST)
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      - ${PZ_MAP_TILES_HOST:-./data/map-tiles}:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Queue Worker — Processes backup jobs, restart jobs, etc.
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pz-queue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --tries=3 --timeout=600 --sleep=3
    volumes:
      - ./app:/var/www/html
      - app-vendor:/var/www/html/vendor
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      - ${PZ_SERVER_HOST:-./data/server}:/pz-server:ro
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      - ${PZ_MAP_TILES_HOST:-./data/map-tiles}:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pz-db
    restart: unless-stopped
    # Not published on the host — app/queue reach it via DNS name "db" on pzserver-internal.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zomboid}
      POSTGRES_USER: ${DB_USERNAME:-zomboid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zomboid}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zomboid} -d ${DB_DATABASE:-zomboid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Redis — Queue, cache, rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pz-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: /bin/sh -c 'set -- --appendonly yes; [ -n "$$REDIS_PASSWORD" ] && set -- "$$@" --requirepass "$$REDIS_PASSWORD"; exec redis-server "$$@"'
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — Restricted Docker API access for app/queue
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: pz-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy with automatic TLS (public edge)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.2-alpine
    container_name: pz-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      # Public edge (shared reverse-proxy network)
      - proxy-network
      # Reach app on the private network
      - pzserver-internal

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
# proxy-network      — public / shared edge (join existing proxy stack; external)
# pzserver-internal  — private stack network (db, redis, app, queue, RCON)
networks:
  proxy-network:
    name: proxy-network
    external: true
  pzserver-internal:
    name: pzserver-internal
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Volumes (app/runtime only — game data is bind-mounted under ./data/)
# -----------------------------------------------------------------------------
# Host paths (override via .env):
#   PZ_DATA_HOST=./data/zomboid      saves, Server/*.ini, logs, Lua bridge
#   PZ_SERVER_HOST=./data/server     SteamCMD dedicated server install
#   PZ_BACKUPS_HOST=./data/backups   world/config backups from the panel
#   PZ_MAP_TILES_HOST=./data/map-tiles
volumes:
  app-vendor:
    name: pz-app-vendor
  app-node-modules:
    name: pz-app-node-modules
  app-build:
    name: pz-app-build
  postgres-data:
    name: pz-postgres
    external: true
  redis-data:
    name: pz-redis
  caddy-data:
    name: pz-caddy-data
  caddy-config:
    name: pz-caddy-config
