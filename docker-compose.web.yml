# -----------------------------------------------------------------------------
# Web stack: Rust API + Vite UI + its own Postgres.
#
# Included in the default `make up` / live compose start. The Laravel panel
# (`app` / `queue` in docker-compose.yml) is commented out so a live server
# only brings up this UI plus game-server and the shared infrastructure.
#
#   docker compose -f docker-compose.yml -f docker-compose.<arch>.yml \
#                  -f docker-compose.web.yml up -d
#
# or simply: make up
# -----------------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the Rust stack's own database, schema owned by sqlx migrations
  # ---------------------------------------------------------------------------
  web-db:
    image: postgres:16-alpine
    container_name: pz-web-db
    restart: unless-stopped
    # Internal only, same as pz-db. docker-compose.web-dev.yml publishes it for
    # host development.
    volumes:
      - ${PZ_WEB_POSTGRES_HOST:-./data/web-postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${WEB_DB_DATABASE:-knox}
      POSTGRES_USER: ${WEB_DB_USERNAME:-knox}
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:-knox}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WEB_DB_USERNAME:-knox} -d ${WEB_DB_DATABASE:-knox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # One-shot: make the archive directory writable before the API starts.
  #
  # `data/backups` is a host bind mount, and web-api cannot fix its own access
  # to it — that container runs read-only as uid 10001 with every capability
  # dropped. Two things used to guarantee the mode and both are gone: the
  # Laravel entrypoint's `chmod 777` (parked along with the `app` service in
  # c318e99) and `pz_ensure_data_dirs`, which only the shell deploy path calls.
  # In August 2026 the directory drifted to 775 root:www-data and every
  # scheduled backup failed for two days, deletes included.
  #
  # This runs on every `up`, so it repairs drift rather than only seeding a new
  # install, and `service_completed_successfully` keeps it ahead of web-api's
  # own start-up writability probe.
  # ---------------------------------------------------------------------------
  backups-init:
    image: busybox:1.37
    container_name: pz-backups-init
    # Root on purpose: the directory it has to chmod is usually root-owned.
    user: "0:0"
    # One-shot. Without this the exited container is restarted forever.
    restart: "no"
    # Exits 0 even when it cannot fix the mode, deliberately. Blocking web-api
    # from starting would take the whole site down over a backup directory;
    # web-api's own probe is what raises the alarm, by failing its healthcheck
    # while carrying on serving.
    command:
      - sh
      - -c
      - |
        chmod 0777 /backups 2>/dev/null || true
        mode=$$(stat -c '%a' /backups 2>/dev/null || echo '?')
        case "$$mode" in
          777|1777)
            echo "[backups-init] /backups is $$mode - uid 10001 can write there"
            ;;
          *)
            echo "[backups-init] WARNING: /backups is $$mode, not 777 - uid 10001"
            echo "[backups-init] may not be able to write there. web-api will"
            echo "[backups-init] report unhealthy if it cannot."
            ;;
        esac
    volumes:
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
    # Nothing to talk to; staying off both networks keeps it out of the way.
    network_mode: none

  # ---------------------------------------------------------------------------
  # Rust API — control plane. Applies its own migrations on boot.
  # ---------------------------------------------------------------------------
  web-api:
    image: ${PZ_WEB_API_IMAGE:-pzserver-web-api:local}
    build:
      context: ./web/api
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-web-api
    restart: unless-stopped
    depends_on:
      web-db:
        condition: service_healthy
      # Ordering only: it exits 0 either way. This just guarantees the
      # chmod has happened before the API probes the directory.
      backups-init:
        condition: service_completed_successfully
    volumes:
      # The mod's JSON exports, plus the account-link channel. Writable, because
      # answering a /account register claim means writing
      # account_link_results.json back for the mod to read. Everything else here
      # is still observe-only.
      #
      # The game container writes this directory as its own uid, so entries need
      # to stay world-writable — the PHP stack's zomboid:heal-lua-bridge is what
      # keeps them that way.
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      # server.ini, for map name and player cap.
      # Writable: staff edit server.ini from the new admin panel.
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      # World archives. Same host folder the PHP stack writes to.
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
    tmpfs:
      - /tmp
    environment:
      API_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://${WEB_DB_USERNAME:-knox}:${WEB_DB_PASSWORD:-knox}@web-db:5432/${WEB_DB_DATABASE:-knox}
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-http://localhost:5174}
      # Public origin of the site. Steam's OpenID needs an absolute return_to
      # and refuses one that is not under the realm, so this has to be the
      # address players actually reach the site on — not a container name.
      # Falls back to the first CORS origin when unset.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      RUST_LOG: ${WEB_API_LOG:-pz_api=info,tower_http=info,warn}

      PZ_RCON_HOST: game-server
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}

      PZ_DATA_PATH: /pz-data
      PZ_SERVER_NAME: ${PZ_SERVER_NAME:-ZomboidServer}
      LUA_BRIDGE_PATH: /lua-bridge
      BACKUP_PATH: /backups
      PZ_STEAM_BRANCH: ${PZ_STEAM_BRANCH:-}

      PZ_CONNECT_HOST: ${PZ_CONNECT_HOST:-}
      PZ_GAME_PORT: ${PZ_GAME_PORT:-16261}

      # First administrator, created only when the users table has none. Same
      # variables the PHP stack's entrypoint already reads.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Leave on unless the site is served over plain HTTP on something other
      # than localhost — browsers treat localhost itself as a secure origin.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PZ_DAILY_REWARD_COINS: ${PZ_DAILY_REWARD_COINS:-25}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      # proxy-network is the non-internal edge: Steam Workshop lookup has to
      # leave the box. pzserver-internal is how this talks to web-db and RCON.
      - proxy-network
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Vite UI — static build served by nginx, which also fronts the API so the
  # browser sees a single origin in production.
  # ---------------------------------------------------------------------------
  web-ui:
    image: ${PZ_WEB_UI_IMAGE:-pzserver-web-ui:local}
    build:
      context: ./web/ui
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-web-ui
    restart: unless-stopped
    depends_on:
      - web-api
    ports:
      # Localhost-only. Put a reverse proxy in front for public access.
      - "127.0.0.1:${WEB_UI_PORT:-8100}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # Both memberships are required. pzserver-internal is declared
      # `internal: true`, and Docker silently drops published ports on a
      # container attached only to an internal network — the port simply never
      # appears on the host. proxy-network is the non-internal edge that makes
      # the publish take effect; pzserver-internal is how nginx reaches web-api.
      - proxy-network
      - pzserver-internal
