# -----------------------------------------------------------------------------
# Web stack: Rust API + Vite UI + its own Postgres.
#
# Included in the default `make up` / live compose start. The Laravel panel
# (`app` / `queue` in docker-compose.yml) is commented out so a live server
# only brings up this UI plus game-server and the shared infrastructure.
#
#   docker compose -f docker-compose.yml -f docker-compose.<arch>.yml \
#                  -f docker-compose.web.yml up -d
#
# or simply: make up
# -----------------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the Rust stack's own database, schema owned by sqlx migrations
  # ---------------------------------------------------------------------------
  web-db:
    image: postgres:16-alpine
    container_name: pz-web-db
    restart: unless-stopped
    # Internal only, same as pz-db. docker-compose.web-dev.yml publishes it for
    # host development.
    volumes:
      - ${PZ_WEB_POSTGRES_HOST:-./data/web-postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${WEB_DB_DATABASE:-knox}
      POSTGRES_USER: ${WEB_DB_USERNAME:-knox}
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:-knox}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WEB_DB_USERNAME:-knox} -d ${WEB_DB_DATABASE:-knox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # One-shot: make the shared bind mounts writable before the API starts.
  #
  # Both directories are host bind mounts shared with the game container, and
  # web-api can fix its access to neither — it runs read-only as uid 10001 with
  # every capability dropped. Everything that used to guarantee these modes is
  # gone: the Laravel entrypoint's chmod and the zomboid:heal-lua-bridge
  # schedule were both parked along with the `app` service in c318e99, and
  # pz_ensure_data_dirs only runs on the shell deploy path. `mkdir -p` under the
  # usual umask leaves a directory 755, so a Linux `make up` hands the API two
  # mounts it cannot write.
  #
  # data/backups drifted exactly this way in August 2026 and every scheduled
  # backup failed for two days, deletes included. data/zomboid/Lua carries the
  # same exposure: uid 10001 writes the account-link, delivery, deposit, export
  # and ticket files there.
  #
  # Only the directory mode is set, never the files inside. Neither writer needs
  # that: the game container runs as root, which ignores file modes entirely,
  # and web-api only ever replaces a bridge file by renaming a temporary over
  # it, which the directory permits rather than the file. (The recursive 0666 in
  # the parked entrypoint was for the PHP stack, which wrote as www-data through
  # plain file opens.) Keep these unsticky for the same reason — 1777 would
  # block the cross-uid rename.
  #
  # Runs on every `up`, so it repairs drift rather than only seeding a new
  # install, and `service_completed_successfully` keeps it ahead of web-api's
  # own start-up writability probes.
  # ---------------------------------------------------------------------------
  data-init:
    image: busybox:1.37
    container_name: pz-data-init
    # Root on purpose: the directories it has to chmod are usually root-owned.
    user: "0:0"
    # One-shot. Without this the exited container is restarted forever.
    restart: "no"
    # Exits 0 even when it cannot fix a mode, deliberately. Blocking web-api
    # from starting would take the whole site down over a data directory;
    # web-api's own probes are what raise the alarm, by failing its healthcheck
    # while carrying on serving.
    command:
      - sh
      - -c
      - |
        for dir in /backups /lua-bridge /map-tiles; do
          chmod 0777 "$$dir" 2>/dev/null || true
          mode=$$(stat -c '%a' "$$dir" 2>/dev/null || echo '?')
          case "$$mode" in
            777|1777)
              echo "[data-init] $$dir is $$mode - uid 10001 can write there"
              ;;
            *)
              echo "[data-init] WARNING: $$dir is $$mode, not 777 - uid 10001"
              echo "[data-init] may not be able to write there. web-api will"
              echo "[data-init] report unhealthy if it cannot."
              ;;
          esac
        done
    volumes:
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      # Named volume: WAL readers (uid 10001) write -shm next to tiles.sqlite.
      - pz-map-tiles-sqlite:/map-tiles
    # Nothing to talk to; staying off both networks keeps it out of the way.
    network_mode: none

  # ---------------------------------------------------------------------------
  # Rust API — control plane. Applies its own migrations on boot.
  # ---------------------------------------------------------------------------
  web-api:
    image: ${PZ_WEB_API_IMAGE:-pzserver-web-api:local}
    build:
      context: ./web/api
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-web-api
    restart: unless-stopped
    depends_on:
      web-db:
        condition: service_healthy
      # Ordering only: it exits 0 either way. This just guarantees the
      # chmods have happened before the API probes those directories.
      data-init:
        condition: service_completed_successfully
    volumes:
      # The mod's JSON exports, plus the account-link channel. Writable, because
      # answering a /account register claim means writing
      # account_link_results.json back for the mod to read. Everything else here
      # is still observe-only.
      #
      # The directory has to stay writable by uid 10001; data-init above is what
      # keeps it that way. The file modes inside do not matter — the game writes
      # as root, and everything written from here lands by renaming a temporary
      # over the target, which the directory permits rather than the file.
      - ${PZ_DATA_HOST:-./data/zomboid}/Lua:/lua-bridge
      # server.ini, for map name and player cap.
      # Writable: staff edit server.ini from the new admin panel.
      - ${PZ_DATA_HOST:-./data/zomboid}:/pz-data
      # Workshop cache (mod.info + ACF). Read-only: SteamCMD writes it from
      # inside the game container, the panel only reads versions from it.
      - ${PZ_SERVER_HOST:-./data/server}/steamapps/workshop:/pz-workshop:ro
      # World archives. Same host folder the PHP stack writes to.
      - ${PZ_BACKUPS_HOST:-./data/backups}:/backups
      # Named volume on the VM's ext4, not a Windows bind. Random reads into a
      # 24 GB SQLite file through Docker Desktop's 9p bind were ~600 ms TTFB;
      # the same bytes here are tens of milliseconds. Writable because WAL
      # readers write a slot in the -shm file. The API still opens the
      # database read-only; the directory must allow shm.
      - pz-map-tiles-sqlite:/map-tiles
    tmpfs:
      - /tmp
    environment:
      API_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://${WEB_DB_USERNAME:-knox}:${WEB_DB_PASSWORD:-knox}@web-db:5432/${WEB_DB_DATABASE:-knox}
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-http://localhost:5174}
      # Public origin of the site. Steam's OpenID needs an absolute return_to
      # and refuses one that is not under the realm, so this has to be the
      # address players actually reach the site on — not a container name.
      # Falls back to the first CORS origin when unset.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      RUST_LOG: ${WEB_API_LOG:-pz_api=info,tower_http=info,warn}

      PZ_RCON_HOST: game-server
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}

      PZ_DATA_PATH: /pz-data
      PZ_WORKSHOP_PATH: /pz-workshop
      PZ_SERVER_NAME: ${PZ_SERVER_NAME:-ZomboidServer}
      LUA_BRIDGE_PATH: /lua-bridge
      BACKUP_PATH: /backups
      MAP_TILES_IMAGE: ${PZ_MAP_TILES_IMAGE:-pzserver-map-tiles:local}
      PZ_SERVER_HOST: ${PZ_SERVER_HOST:-./data/server}
      PZ_TEXTUREPACKS_HOST: ${PZ_TEXTUREPACKS_HOST:-./data/server/media/texturepacks}
      PZ_MAP_TILES_HOST: ${PZ_MAP_TILES_HOST:-./data/map-tiles}
      PZ_DATA_HOST: ${PZ_DATA_HOST:-./data/zomboid}
      PZ_SAVE_GAME: Multiplayer/${PZ_SERVER_NAME:-ZomboidServer}
      MAP_TILES_WORLD_SCAN_SECS: ${MAP_TILES_WORLD_SCAN_SECS:-120}
      MAP_TILES_WORLD_MAX_CELLS: ${MAP_TILES_WORLD_MAX_CELLS:-8}
      MAP_TILES_VOLUME: pz-map-tiles-sqlite
      PZ_GAME_VERSION: ${PZ_GAME_VERSION:-42.20.0}
      PZ_STEAM_BRANCH: ${PZ_STEAM_BRANCH:-}

      PZ_CONNECT_HOST: ${PZ_CONNECT_HOST:-}
      PZ_GAME_PORT: ${PZ_GAME_PORT:-16261}

      # First administrator, created only when the users table has none. Same
      # variables the PHP stack's entrypoint already reads.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Leave on unless the site is served over plain HTTP on something other
      # than localhost — browsers treat localhost itself as a secure origin.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PZ_DAILY_REWARD_COINS: ${PZ_DAILY_REWARD_COINS:-25}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      # proxy-network is the non-internal edge: Steam Workshop lookup has to
      # leave the box. pzserver-internal is how this talks to web-db and RCON.
      - proxy-network
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # Vite UI — static build served by nginx, which also fronts the API so the
  # browser sees a single origin in production.
  # ---------------------------------------------------------------------------
  web-ui:
    image: ${PZ_WEB_UI_IMAGE:-pzserver-web-ui:local}
    build:
      context: ./web/ui
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-web-ui
    restart: unless-stopped
    depends_on:
      - web-api
    ports:
      # Localhost-only. Put a reverse proxy in front for public access.
      - "127.0.0.1:${WEB_UI_PORT:-8100}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # Both memberships are required. pzserver-internal is declared
      # `internal: true`, and Docker silently drops published ports on a
      # container attached only to an internal network — the port simply never
      # appears on the host. proxy-network is the non-internal edge that makes
      # the publish take effect; pzserver-internal is how nginx reaches web-api.
      - proxy-network
      - pzserver-internal

  # ---------------------------------------------------------------------------
  # One-off tile render. `profiles` keeps it out of `up`; it is run on demand
  # through `make map-tiles` and exits when finished.
  # ---------------------------------------------------------------------------
  map-tiles:
    image: ${PZ_MAP_TILES_IMAGE:-pzserver-map-tiles:local}
    build:
      context: ./web/tools/map-tiles
      dockerfile: Dockerfile
    pull_policy: build
    container_name: pz-map-tiles
    profiles: ["tools"]
    depends_on:
      game-server:
        condition: service_healthy
    # pzmap2dzi renders through a multiprocessing pool that passes 2048x2048
    # RGBA tiles between workers in POSIX shared memory, which is /dev/shm.
    # Docker's default /dev/shm is 64 MB; one such buffer is 16 MB, and
    # worker_count: auto spawns one worker per core. On a 16-core host that is
    # 256 MB of demand against 64 MB of tmpfs.
    #
    # The failure is silent and total: workers die on the allocation without
    # raising, the parent waits on them forever, and the render sits at 0% CPU
    # having written nothing. It does not crash, so nothing reports it.
    #
    # Sized to sit above conf.yaml's cache_limit_mb (16384) with room for the
    # workers' in-flight buffers on top. The bound in conf.yaml is what actually
    # prevents the stall; this is the headroom it needs to be a bound rather
    # than a cliff. tmpfs is allocated lazily, so it costs nothing until used.
    shm_size: 24gb
    volumes:
      # The game install, for the map cells and textures. Read-only: rendering
      # must never be able to damage the server's own files.
      - ${PZ_SERVER_HOST:-./data/server}:/pz:ro
      # Texture packs, layered onto the read-only server install at the path
      # pzmap2dzi's own vanilla.txt derives: '{pz_root}/media/texturepacks'.
      #
      # The dedicated server download does NOT ship them — it never draws
      # anything, so it has no use for them. pzmap2dzi does: without them every
      # tile renders untextured and the map comes out blank. verify.py cannot
      # catch that, because it reads map_info.json, which is geometry and not
      # pixels; run.sh fails fast on it instead.
      #
      # The default is the path inside the server install, so an operator who
      # copies the packs there needs no override at all. On a machine with a PZ
      # *client*, point PZ_TEXTUREPACKS_HOST at its media/texturepacks instead.
      # The make targets mkdir the default first, because Docker cannot create
      # a mountpoint inside a read-only bind mount.
      - ${PZ_TEXTUREPACKS_HOST:-./data/server/media/texturepacks}:/pz/media/texturepacks:ro
      # Render scratch (html tree, texture cache). Stays on the host bind.
      - ${PZ_MAP_TILES_HOST:-./data/map-tiles}:/out
      # Live pack. Same volume web-api reads, so a region job updates the
      # file the site is serving.
      - pz-map-tiles-sqlite:/pack
      # Dedicated-server worlds. Region jobs snapshot dirty chunks from here
      # and paint them as a save overlay. Read-only: never write the live save.
      - ${PZ_DATA_HOST:-./data/zomboid}/Saves:/saves:ro
    environment:
      PZ_GAME_VERSION: ${PZ_GAME_VERSION:-42.20.0}
      PZ_SERVER_NAME: ${PZ_SERVER_NAME:-ZomboidServer}
      PZ_SAVE_GAME: Multiplayer/${PZ_SERVER_NAME:-ZomboidServer}
      # Flush loaded chunks (open doors) before the snapshot. game-server DNS
      # only exists on pzserver-internal; proxy-network is the path out for
      # pzdataspec download.
      PZ_RCON_HOST: game-server
      PZ_RCON_PORT: ${PZ_RCON_PORT:-27015}
      PZ_RCON_PASSWORD: ${PZ_RCON_PASSWORD:-}
    networks:
      - pzserver-internal
      - proxy-network

# The one named volume in this stack. tiles.sqlite is a 24 GB random-read
# database; on Windows a bind of that file through Docker Desktop's 9p is
# ~30× slower than the VM's own ext4. Render scratch stays under ./data.
volumes:
  pz-map-tiles-sqlite:
    name: pz-map-tiles-sqlite
